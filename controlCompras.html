<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Compras - Tienda NATY</title>
    <link rel="stylesheet" href="css/controlCompras.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h1 class="logo">Tienda NATY</h1>
            <ul class="menu">
                <li><a href="gestionProductos.html"><i class="fas fa-box"></i> Productos</a></li>
                <li><a href="controlCompras.html" class="active"><i class="fas fa-shopping-cart"></i> Compras</a></li>
                <li><a href="gestionInventario.html"><i class="fas fa-warehouse"></i> Inventario</a></li>
                <li><a href="gestionVentas.html"><i class="fas fa-cash-register"></i> Ventas</a></li>
                <li><a href="reportesEstadisticas.html"><i class="fas fa-chart-bar"></i> Reportes</a></li>
                <li><a href="gestionProveedores.html"><i class="fas fa-truck"></i> Proveedores</a></li>
                <li><a href="alertas.html"><i class="fas fa-bell"></i> Alertas</a></li>
                <li><a href="cobrar.html"><i class="fas fa-money-bill-wave"></i> Cobrar</a></li>
                <li class="logout-btn">
                    <a href="#" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                 </li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <h1>Control de Compras</h1>
                <button class="btn-add" id="btnOpenPurchase">
                    <i class="fas fa-plus"></i> Nueva Compra
                </button>
            </header>

            <div class="filters-container">
                <div class="search-container">
                    <input type="text" placeholder="Buscar compras..." class="search-input" id="searchInput">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="filter-options">
                    <select class="filter-select" id="estadoFiltro">
                        <option value="all">Todos los estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Completada">Completada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                    <div class="date-filter">
                        <label>Desde:</label>
                        <input type="date" class="date-input" id="fechaDesde">
                    </div>
                    <div class="date-filter">
                        <label>Hasta:</label>
                        <input type="date" class="date-input" id="fechaHasta">
                    </div>
                </div>
            </div>

            <div class="purchases-container" id="purchasesContainer"></div>
        </main>
    </div>

    <!-- Modal Nueva Compra -->
    <div class="modal" id="purchaseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva Compra</h2>
                <button class="close-modal" id="btnClosePurchaseModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="purchaseForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select id="proveedorSelect" required>
                                <option value="">Seleccionar proveedor</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha de Compra</label>
                            <input type="date" id="fechaCompraInput" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <select id="estadoCompraSelect" disabled>
                            <option value="Pendiente" selected>Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>

                    <div class="product-list-container">
                        <div class="product-list-header">
                            <h3>Productos</h3>
                            <button type="button" class="btn-add-product">
                                <i class="fas fa-plus"></i> Agregar Producto
                            </button>
                        </div>

                        <div class="product-items"></div>

                        <div class="purchase-summary">
                            <div class="summary-item">
                                <span>Subtotal:</span>
                                <span class="sum-subtotal">$0.00</span>
                            </div>
                            <div class="summary-item">
                                <span>Impuestos (16%):</span>
                                <span class="sum-iva">$0.00</span>
                            </div>
                            <div class="summary-item total">
                                <span>Total:</span>
                                <span class="sum-total">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Notas</label>
                        <textarea rows="3" placeholder="Observaciones o detalles adicionales"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btnCancelPurchase">Cancelar</button>
                <button class="btn-primary" id="btnSavePurchase">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div class="modal" id="purchaseDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailTitle">Detalle de Compra</h2>
                <button class="close-modal" id="btnCloseDetailModal">&times;</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btnCloseDetail">Cerrar</button>
                <button class="btn-secondary" id="btnPrintDetail">Imprimir</button>
                <button class="btn-primary" id="btnDownloadDetail">Descargar PDF</button>
            </div>
        </div>
    </div>

    <script src="js/controlCompras.js" defer></script>
</body>
</html>
