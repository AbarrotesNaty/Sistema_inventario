<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Tienda de Abarrotes NATY</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3721/3721819.png">
</head>
<body>
    <div class="container">
        <div class="illustration">
            <img src="https://cdn-icons-png.flaticon.com/512/3721/3721819.png" alt="Logo NATY">
            <h1>Tienda de Abarrotes <span>NATY</span></h1>
            <p>Bienvenido al sistema de inventario. Gestiona tus productos y ventas fácilmente.</p>
        </div>

        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo</label>
                    <input type="text" id="email" placeholder="Ej. admin@naty.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn">Ingresar</button>

                <!-- 🔥 NUEVO: Enlace para recuperar contraseña -->
                <p class="forgot-password">
                    <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                </p>

                <p class="msg-error" id="errorMsg"></p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
