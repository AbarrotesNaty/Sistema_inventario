<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container" style="max-width: 450px; padding: 40px;">
    <div class="login-box">

        <h2>Restablecer contraseña</h2>

        <form id="resetForm">

            <div class="input-group">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu nueva contraseña" required>
            </div>

            <div class="input-group">
                <label for="confirm">Confirmar contraseña</label>
                <input type="password" id="confirm" placeholder="Vuelve a escribirla" required>
            </div>

            <button type="submit" class="btn">Actualizar contraseña</button>

            <p class="msg-error" id="msg"></p>

            <p class="forgot-password">
                <a href="login.html">← Volver al login</a>
            </p>
        </form>

    </div>
</div>

<script src="js/reset-password.js"></script>
</body>
</html>
